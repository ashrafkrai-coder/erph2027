<!doctype html>
<html lang="ms"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#175b45"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icons/apple-touch-icon.png"><link rel="preconnect" href="https://script.google.com" crossorigin><link rel="preconnect" href="https://script.googleusercontent.com" crossorigin><title>Smart RPH</title><link rel="stylesheet" href="./style.css"></head>
<body><header><strong>Smart RPH</strong><div><button id="install" hidden>Pasang aplikasi</button></div></header><p id="notice" role="status" aria-label="Status internet"></p>
<main>
<div id="ui">
<section class="hero"><span class="eyebrow">SMART RPH | 2027</span><h1>Jana RPH</h1></section>
<div class="card"><label class="label" for="week">Minggu pengajaran</label><select id="week" disabled><option>Memuatkan minggu…</option></select></div>
<div class="card"><span class="label">Hari</span><label class="day all"><input type="checkbox" id="all" checked><span>Semua hari</span></label><div class="days" id="days"></div></div>
<button class="button" id="generate" disabled>Jana RPH</button>
<div class="hint">Refleksi umum dan tindakan susulan diisi automatik; boleh edit terus dalam template. Jana semula akan menggantikan catatan manual pada hari dipilih.</div>
<div id="status" class="status" role="status" aria-live="polite"></div><a id="archive" class="archive" target="_blank" rel="noopener" hidden>Buka salinan Google Sheets</a><div id="calendar" class="foot"></div>
</div>
<iframe id="app" title="Penjana RPH" referrerpolicy="strict-origin-when-cross-origin" hidden></iframe>
</main>
<footer>Developed by ustazashraf 2027</footer><script src="./config.js"></script><script src="./app.js"></script></body></html>
